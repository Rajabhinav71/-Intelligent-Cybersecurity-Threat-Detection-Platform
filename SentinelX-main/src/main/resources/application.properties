spring.datasource.url=jdbc:h2:mem:sentinelx;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

sentinelx.brute-force.max-attempts=5
sentinelx.brute-force.window-minutes=5
sentinelx.rate-limit.max-requests-per-minute=100
sentinelx.risk.block-threshold=80
sentinelx.risk.alert-threshold=50
sentinelx.ml.service-url=http://localhost:5000/predict

server.port=8080